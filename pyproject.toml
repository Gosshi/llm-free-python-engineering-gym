[project]
name = "llm-free-python-engineering-gym"
version = "0.1.0"
description = "A repository for LLM-free Python implementation practice and review."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "challenges/001-diagnostic-api/src"

[tool.setuptools.packages.find]
where = ["challenges/001-diagnostic-api/src"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["challenges/001-diagnostic-api/tests"]
pythonpath = ["challenges/001-diagnostic-api/src"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["diagnostic_api"]
